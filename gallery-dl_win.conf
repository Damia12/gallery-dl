    },
    "simpcity>erome": {
      "directory": []
    },
    "simpcity>jpgfish": {
      "directory": []
    },
    "simpcity>imgbox": {
      "directory": []
    },
    "simpcity>imgur": {
      "directory": []
    },
    "simpcity>postimg": {
