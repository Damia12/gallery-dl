{
  "extractor": {
    "base-directory": "G:\\Rips",
    "simpcity": {
      "base-directory": "G:\\Rips\\Simpcity",
      "archive": "G:\\Rips\\Simpcity\\archive.db",
      "cookies": [
        "firefox"
      ],
      "order-posts": "asc",
      "parent-directory": true,
      "directory": [
        "{thread[title]}"
      ],
      "whitelist": [
        "bunkr",
        "cyberdrop",
        "cyberfile",
        "pixeldrain",
        "gofile",
        "saint",
        "erome",
        "jpgfish",
        "imgbox",
        "imgur",
        "postimg",
        "redgifs",
        "turbo",
        "fapello",
        "pimpandhost"
      ],
      "sleep-request": 6,
      "sleep": 2,
      "retries": 6,
      "filename": "{post_id}_{filename}.{extension}"
    },
    "erome": {
      "cookies": [
        "firefox"
      ],
      "videos": true,
      "quality": "source",
      "directory": [
        "{user}",
        "{title}"
      ],
      "filename": "{album_id}_{num:>03}.{extension}"
    },
    "bunkr": {
      "sleep-request": 2
    },
    "cyberdrop": {
      "sleep-request": 2
    },
    "gofile": {
      "api-token": ""
    },
    "pixeldrain": {
      "api-key": ""
    },
    "redgifs": {
      "quality": "hd"
    },
    "imgur": {
      "mp4": true
    },
    "filester": {
      "filename": "{name}.{extension}"
    },
    "simpcity>bunkr": {
      "directory": []
    },
    "simpcity>cyberdrop": {
