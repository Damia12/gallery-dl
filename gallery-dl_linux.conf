{
  "extractor": {
    "simpcity": {
      "cookies": [
        "firefox"
      ],
      "order-posts": "asc",
      "parent-directory": true,
      "directory": [
        "{thread[title]}"
      ],
      "whitelist": [
        "bunkr",
        "cyberdrop",
        "cyberfile",
        "pixeldrain",
        "gofile",
        "saint",
        "erome",
        "jpgfish",
        "imgbox",
        "imgur",
        "postimg",
        "redgifs",
        "turbo",
        "reddit",
        "fapello",
        "pimpandhost"
      ],
      "sleep-request": 6,
      "retries": 6,
      "filename": "{post_id}_{filename}.{extension}",
      "headers": {
        "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:124.0) Gecko/20100101 Firefox/124.0"
      }
    },
    "simpcity>jpgfish": {
      "directory": []
    },
    "simpcity>bunkr": {
      "directory": []
    },
    "simpcity>cyberdrop": {
      "directory": []
    }
  },
  "base-directory": "~/SimpCity",
  "downloader": {
    "retries": 6,
    "timeout": 60,
    "part": true,
    "concurrent": 2
  },
  "output": {
    "progress": true
  },
  "archive": "~/SimpCity/archive.db",
  "log": {
    "level": "info",
    "file": "~/SimpCity/errores.log",
    "format": "[{asctime}][{name}][{levelname}] {message}"
  }
}
