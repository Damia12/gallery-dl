{
  "extractor": {
    "base-directory": "~/Rips",
    "simpcity": {
      "base-directory": "~/Rips/Simpcity",
      "archive": "~/Rips/Simpcity/archive.db",
      "cookies": [
        "firefox"
      ],
      "order-posts": "asc",
      "parent-directory": true,
      "directory": [
        "{thread[title]}"
      ],
      "whitelist": [
        "bunkr",
        "cyberdrop",
        "cyberfile",
        "pixeldrain",
        "gofile",
        "saint",
        "erome",
        "jpgfish",
        "imgbox",
        "imgur",
        "postimg",
        "redgifs",
        "turbo",
        "fapello",
        "pimpandhost"
      ],
      "sleep-request": 6,
      "sleep": 2,
      "retries": 6,
      "filename": "{post_id}_{filename}.{extension}"
    },
    "erome": {
      "cookies": [
        "firefox"
      ],
      "videos": true,
      "quality": "source",
      "directory": [
        "{user}",
        "{title}"
      ],
      "filename": "{album_id}_{num:>03}.{extension}"
    },
    "bunkr": {
      "sleep-request": 3,
      "sleep": 1.5
    },
    "cyberdrop": {
      "sleep-request": 3,
      "sleep": 1.5
    },
    "saint": {
      "sleep-request": 3,
      "sleep": 1.5
    },
    "pixeldrain": {
      "sleep-request": 3,
      "sleep": 1.5
    },
    "cyberfile": {
      "sleep-request": 3,
      "sleep": 1.5
    },
    "gofile": {
      "api-token": ""
    },
    "redgifs": {
      "quality": "hd"
    },
    "imgur": {
      "mp4": true
    },
    "filester": {
      "filename": "{name}.{extension}"
    },
    "simpcity>bunkr": {
      "directory": []
    },
    "simpcity>cyberdrop": {
      "directory": []
    },
    "simpcity>cyberfile": {
      "directory": []
    },
    "simpcity>pixeldrain": {
      "directory": []
    },
    "simpcity>gofile": {
      "directory": []
    },
    "simpcity>saint": {
      "directory": []
    },
    "simpcity>erome": {
      "directory": []
    },
    "simpcity>jpgfish": {
      "directory": []
    },
    "simpcity>imgbox": {
      "directory": []
    },
    "simpcity>imgur": {
      "directory": []
    },
    "simpcity>postimg": {
      "directory": []
    },
    "simpcity>redgifs": {
      "directory": []
    },
    "simpcity>turbo": {
      "directory": []
    },
    "simpcity>reddit": {
      "directory": []
    },
    "simpcity>fapello": {
      "directory": []
    },
    "simpcity>pimpandhost": {
      "directory": []
    }
  },
  "downloader": {
    "retries": 6,
    "timeout": 60,
    "backoff": 5,
    "part": true,
    "concurrent": 1,
    "http": {
      "user-agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
    }
  },
  "output": {
    "progress": true,
    "log": {
      "format": "[Post: {post_id}] [{category}][{level}] {message}"
    }
  }
}